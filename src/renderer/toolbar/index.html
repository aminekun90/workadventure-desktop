<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'" />
    <title>WorkAdventure</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="toolbar.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <header class="toolbar">
      <div class="actions">
        <button id="home" class="button quiet" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h4.5v-5.5h4V20h4.5V9.5" /></svg>
          <span>Accueil</span>
        </button>
        <button id="maps" class="button quiet" type="button" title="Changer de map">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 6.5 6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5zM9 4v13.5M15 6.5V20" /></svg>
          <span>Maps</span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
        </button>
      </div>

      <div class="place" aria-live="polite">
        <span class="dot"></span>
        <span id="label" class="label"></span>
        <span id="host" class="host"></span>
      </div>

      <div class="actions">
        <div id="environment" class="actions environment" aria-label="Ambiance du salon">
          <button id="weather" class="button quiet" type="button" disabled title="Météo du salon — partagée avec tous" aria-label="Changer la météo du salon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a4 4 0 0 1-.3-8 5.5 5.5 0 0 1 10.6-1A4.5 4.5 0 0 1 18 15H7M8 18l-1 3m6-3-1 3m6-3-1 3" /></svg>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <button id="night" class="button quiet" type="button" disabled title="Cycle jour/nuit — pour moi">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.5A8.5 8.5 0 0 1 9.5 4.5a8.5 8.5 0 1 0 10 10ZM17 3v4m-2-2h4" /></svg>
            <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <button id="ground" class="button quiet" type="button" disabled title="Sol — pour moi">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4c-8 0-14 3-14 9a6 6 0 0 0 6 6c6 0 8-7 8-15ZM4 21l11-11m-6 6v-5m0 5h5" /></svg>
            <span> Sol </span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <button id="christmas" class="button quiet" type="button" disabled title="Thème de Noël — pour moi">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 4 5h-2l4 5h-3l5 6H4l5-6H6l4-5H8l4-5Zm0 16v3" /></svg>
            <span> Noël </span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <button id="effects" class="button quiet icon" type="button" disabled title="Afficher les effets météo — pour moi" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3s-7 8-7 12a7 7 0 0 0 14 0c0-4-7-12-7-12Zm-3 12a3 3 0 0 0 3 3" /></svg>
          </button>
        </div>
        <span id="environment-error" class="environment-error" role="status" aria-live="polite" hidden></span>
        <button id="update" class="update-pill" type="button" hidden></button>
        <button id="reload" class="button quiet icon" type="button" title="Recharger la page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" /></svg>
        </button>
      </div>
    </header>
  </body>
</html>
