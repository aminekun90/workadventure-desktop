<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'"
    />
    <title>À propos de WorkAdventure</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="about.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div class="titlebar" aria-hidden="true"></div>

    <main class="about">
      <img class="logo" src="icon.png" alt="" />
      <h1>WorkAdventure</h1>
      <p class="version">
        Version <span id="version"></span>
        <span id="channel" class="channel"></span>
      </p>
      <p class="tagline">Ton bureau virtuel, toujours allumé.</p>

      <dl class="specs">
        <div><dt>Electron</dt><dd id="electron"></dd></div>
        <div><dt>Chromium</dt><dd id="chromium"></dd></div>
        <div><dt>Node</dt><dd id="node"></dd></div>
        <div><dt>Système</dt><dd id="system"></dd></div>
      </dl>

      <section class="update" aria-label="Mises à jour">
        <p id="update-status" class="update-text" aria-live="polite"></p>
        <div class="update-actions">
          <button id="update" class="update-pill" type="button" hidden></button>
          <button id="check" class="button" type="button">Rechercher les mises à jour</button>
        </div>
      </section>

      <nav class="links" aria-label="Liens">
        <button id="release-notes" class="button quiet" type="button">Nouveautés</button>
        <button id="repository" class="button quiet" type="button">Code source</button>
        <button id="logs" class="button quiet" type="button">Ouvrir les logs</button>
        <button id="copy" class="button quiet" type="button">Copier les infos</button>
      </nav>
    </main>

    <section id="notes" class="notes" aria-labelledby="notes-title" hidden>
      <h2 id="notes-title"></h2>
      <div id="notes-content" class="notes-content" aria-live="polite"></div>
      <div class="notes-actions">
        <button id="notes-github" class="button quiet" type="button">Voir sur GitHub</button>
        <button id="notes-close" class="button primary" type="button">Fermer</button>
      </div>
    </section>

    <div class="city">
      <svg id="skyline" class="skyline" aria-hidden="true"></svg>
      <footer id="copyright" class="copyright"></footer>
    </div>
  </body>
</html>
