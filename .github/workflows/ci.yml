name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn run check

  # Each OS uploads its installers and update manifests to the same draft release of the tag.
  package:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # macOS is signed ad hoc (electron-builder.yml); Windows stays unsigned until a certificate exists.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      # The project's self-signed certificate (scripts/create-mac-signing-certificate.sh): a stable identity for macOS,
      # so that camera and microphone permissions survive updates. Without the secret, the ad hoc signature stays.
      - name: Prepare the macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MAC_SIGNING_P12" ]; then echo "No MAC_SIGNING_P12 secret: ad hoc signature"; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$MAC_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$MAC_SIGNING_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          # codesign only finds an identity in a keychain of the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          identity=$(security find-identity -p codesigning "$keychain" | awk '/\)/ {print $2; exit}')
          echo "MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "MAC_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "MAC_SIGNING_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
      - run: yarn package --publish always

  # Publishes the draft once every OS is uploaded: apps only see a release when it is complete.
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the release (pre-release for x.y.z-beta.n tags)
        run: gh release edit "$TAG" --draft=false --prerelease="$([[ "$TAG" == *-* ]] && echo true || echo false)"
