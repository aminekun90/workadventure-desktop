appId: fr.goyan.workadventure
productName: WorkAdventure
directories:
  output: release
# No spaces: GitHub renames them in release assets, which would break the update manifests.
artifactName: ${productName}-${version}-${arch}.${ext}
# Release assets + update manifests (latest*.yml / beta*.yml) read by electron-updater.
publish:
  provider: github
  owner: aminekun90
  repo: workadventure-desktop
files:
  - dist/**
  - "!dist/**/*.map"
  - assets/*.png
  - package.json
# workadventure:// links open a room in the app (src/main/deep-links.ts).
protocols:
  - name: WorkAdventure
    schemes: [workadventure]

mac:
  category: public.app-category.business
  target: [dmg, zip]
  hardenedRuntime: true
  # Ad-hoc signature until an Apple Developer ID is available: Apple Silicon refuses unsigned bundles.
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: WorkAdventure utilise la caméra pour la vidéo de proximité et les réunions.
    NSMicrophoneUsageDescription: WorkAdventure utilise le micro pour l'audio de proximité et les réunions.
    NSAppleEventsUsageDescription: WorkAdventure lit le morceau joué par Spotify pour le partager avec vos collègues, si vous l'activez.

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target: [AppImage, deb]
  category: Network
  maintainer: Amine Bouzahar
