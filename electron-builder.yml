appId: fr.goyan.workadventure
productName: WorkAdventure
directories:
  output: release
# No spaces: GitHub renames them in release assets, which would break the update manifests.
artifactName: ${productName}-${version}-${arch}.${ext}
# Release assets + update manifests (latest*.yml / beta*.yml) read by electron-updater.
publish:
  provider: github
  owner: aminekun90
  repo: workadventure-desktop
files:
  - dist/**
  - "!dist/**/*.map"
  - assets/*.png
  - package.json
# workadventure:// links open a room in the app (src/main/deep-links.ts).
protocols:
  - name: WorkAdventure
    schemes: [workadventure]
# Written into the packaged Electron binary: no environment variable or flag can turn them back on.
# The app never runs itself as Node, uses NODE_OPTIONS, nor is debugged once packaged (source runs are not fused).
# Left at their default: cookie encryption (Keychain prompt after each update, the ad hoc signature changes),
# asar integrity (to revisit with a Developer ID), file:// privileges (the local pages are loaded from files).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

afterSign: scripts/sign-mac-stable.cjs
mac:
  category: public.app-category.business
  target: [dmg, zip]
  hardenedRuntime: true
  # Ad-hoc signature until an Apple Developer ID is available: Apple Silicon refuses unsigned bundles. In CI, the
  # afterSign hook signs again with the project's self-signed certificate (scripts/sign-mac-stable.cjs).
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: WorkAdventure utilise la caméra pour la vidéo de proximité et les réunions.
    NSMicrophoneUsageDescription: WorkAdventure utilise le micro pour l'audio de proximité et les réunions.
    NSAppleEventsUsageDescription: WorkAdventure lit le morceau joué par Spotify pour le partager avec vos collègues, si vous l'activez.

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target: [AppImage, deb]
  category: Network
  maintainer: Amine Bouzahar
