appId: fr.goyan.workadventure
productName: WorkAdventure
directories:
  output: release
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json

mac:
  category: public.app-category.business
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: WorkAdventure utilise la caméra pour la vidéo de proximité et les réunions.
    NSMicrophoneUsageDescription: WorkAdventure utilise le micro pour l'audio de proximité et les réunions.

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target: [AppImage, deb]
  category: Network
  maintainer: Amine Bouzahar
